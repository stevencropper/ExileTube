name: Build Exile Tube

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Exile Tube branding assets
        uses: actions/checkout@v4
        with:
          path: exile

      - name: Checkout pinned SmartTube source
        uses: actions/checkout@v4
        with:
          repository: yuliskov/SmartTube
          ref: c0dfea54672f9cbba8ae3d1272917484b2c71dc4
          submodules: recursive
          path: smarttube

      - name: Apply Exile Tube identity
        working-directory: smarttube
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path('smarttubetv/src/stfdroid/res/values/strings.xml')
          text = strings.read_text()
          text = text.replace('SmartTube F-Droid', 'Exile Tube')
          strings.write_text(text)

          gradle = Path('smarttubetv/build.gradle')
          text = gradle.read_text()
          text = text.replace(
              'applicationId "app.smarttube.fdroid"',
              'applicationId "uk.co.exilemedia.tube"'
          )
          text = text.replace(
              'def project = "SmartTube"',
              'def project = "ExileTube"'
          )
          gradle.write_text(text)

          for path in Path('leanbackassistant').rglob('*'):
              if path.is_file() and path.suffix in {'.xml', '.java'}:
                  try:
                      src = path.read_text()
                  except UnicodeDecodeError:
                      continue

                  dst = src.replace(
                      'app.smarttube.fdroid',
                      'uk.co.exilemedia.tube'
                  )
                  dst = dst.replace(
                      'org.smarttube.stable',
                      'uk.co.exilemedia.tube'
                  )
                  dst = dst.replace(
                      'org.smarttube.beta',
                      'uk.co.exilemedia.tube'
                  )
                  dst = dst.replace(
                      'org.smarttube',
                      'uk.co.exilemedia.tube'
                  )

                  if dst != src:
                      path.write_text(dst)

          utils = Path(
              'common/src/main/java/com/liskovsoft/'
              'smartyoutubetv2/common/utils/Utils.java'
          )

          if utils.exists():
              src = utils.read_text()
              marker = '"app.smarttube.fdroid",'

              if marker in src and '"uk.co.exilemedia.tube",' not in src:
                  src = src.replace(
                      marker,
                      marker + '\n            "uk.co.exilemedia.tube",'
                  )
                  utils.write_text(src)
          PY

      - name: Apply Exile Premium Tube artwork
        run: |
          set -e

          ICON="exile/IMG_9170.png"
          SPLASH="exile/IMG_9171.jpeg"
          BANNER="exile/BDEA3ABA-ABD5-46CC-BE86-6DFDB9550A24.png"

          echo "Finding SmartTube visual resources..."

          find smarttube/smarttubetv/src -type f \
            \( -name 'app_icon.png' -o \
               -name 'app_logo.png' -o \
               -name 'app_banner.png' \) \
            -print

          while IFS= read -r target; do
            case "$(basename "$target")" in
              app_icon.png)
                cp "$ICON" "$target"
                ;;
              app_logo.png)
                cp "$ICON" "$target"
                ;;
              app_banner.png)
                cp "$BANNER" "$target"
                ;;
            esac
          done < <(
            find smarttube/smarttubetv/src -type f \
              \( -name 'app_icon.png' -o \
                 -name 'app_logo.png' -o \
                 -name 'app_banner.png' \)
          )

          mkdir -p smarttube/smarttubetv/src/stfdroid/res/drawable-nodpi
          cp "$SPLASH" \
            smarttube/smarttubetv/src/stfdroid/res/drawable-nodpi/exile_splash.jpg

          echo "Exile artwork copied."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.0.6113669"

      - name: Build Exile Tube debug APK
        working-directory: smarttube
        env:
          JAVA_TOOL_OPTIONS: -XX:+PerfDisableSharedMem
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :smarttubetv:assembleStfdroidDebug

      - name: Upload Exile Tube APK
        uses: actions/upload-artifact@v4
        with:
          name: ExileTube-visual-brand-build
          path: >
            smarttube/smarttubetv/build/outputs/apk/stfdroid/debug/*.apk
          if-no-files-found: error
