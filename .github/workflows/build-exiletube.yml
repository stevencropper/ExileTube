name: Build Exile Tube

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Exile Tube branding assets
        uses: actions/checkout@v4
        with:
          path: exile

      - name: Checkout pinned SmartTube source
        uses: actions/checkout@v4
        with:
          repository: yuliskov/SmartTube
          ref: c0dfea54672f9cbba8ae3d1272917484b2c71dc4
          submodules: recursive
          path: smarttube

      - name: Apply Exile Tube identity
        working-directory: smarttube
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path('smarttubetv/src/stfdroid/res/values/strings.xml')
          text = strings.read_text()
          text = text.replace('SmartTube F-Droid', 'Exile Tube')
          strings.write_text(text)

          gradle = Path('smarttubetv/build.gradle')
          text = gradle.read_text()
          text = text.replace(
              'applicationId "app.smarttube.fdroid"',
              'applicationId "uk.co.exilemedia.tube"'
          )
          text = text.replace(
              'def project = "SmartTube"',
              'def project = "ExileTube"'
          )

          # Build 10
          text = text.replace(
              'versionCode 2437',
              'versionCode 2439'
          )
          text = text.replace(
              'versionName "32.47"',
              'versionName "32.49"'
          )

          gradle.write_text(text)

          for path in Path('leanbackassistant').rglob('*'):
              if path.is_file() and path.suffix in {'.xml', '.java'}:
                  try:
                      src = path.read_text()
                  except UnicodeDecodeError:
                      continue

                  dst = src.replace(
                      'app.smarttube.fdroid',
                      'uk.co.exilemedia.tube'
                  )
                  dst = dst.replace(
                      'org.smarttube.stable',
                      'uk.co.exilemedia.tube'
                  )
                  dst = dst.replace(
                      'org.smarttube.beta',
                      'uk.co.exilemedia.tube'
                  )
                  dst = dst.replace(
                      'org.smarttube',
                      'uk.co.exilemedia.tube'
                  )

                  if dst != src:
                      path.write_text(dst)

          utils = Path(
              'common/src/main/java/com/liskovsoft/'
              'smartyoutubetv2/common/utils/Utils.java'
          )

          if utils.exists():
              src = utils.read_text()
              marker = '"app.smarttube.fdroid",'

              if marker in src and '"uk.co.exilemedia.tube",' not in src:
                  src = src.replace(
                      marker,
                      marker + '\n            "uk.co.exilemedia.tube",'
                  )
                  utils.write_text(src)
          PY

      - name: Add Exile Access login and updater
        working-directory: smarttube
        run: |
          mkdir -p smarttubetv/src/main/java/uk/co/exilemedia/tube

          cat > smarttubetv/src/main/java/uk/co/exilemedia/tube/ExileLoginActivity.java <<'JAVA'
          package uk.co.exilemedia.tube;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.liskovsoft.smartyoutubetv2.tv.ui.main.SplashActivity;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.UUID;

          public class ExileLoginActivity extends Activity {
              private static final String API_BASE =
                      "https://unwieldy-tender-byte.replit.app/api";

              private static final String UPDATE_ENDPOINT =
                      API_BASE + "/client/update";

              private static final String PREFS = "exile_access";
              private static final String KEY_TOKEN = "session_token";
              private static final String KEY_DEVICE_ID = "device_id";

              private static final int REQUEST_INSTALL_PERMISSION = 501;

              private SharedPreferences prefs;
              private EditText usernameInput;
              private EditText passwordInput;
              private Button loginButton;
              private TextView statusText;
              private String deviceId;

              private String pendingUpdateUrl;
              private String pendingVersionName;

              private long activeDownloadId = -1;
              private BroadcastReceiver downloadReceiver;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  deviceId = getOrCreateDeviceId();

                  buildUi();

                  String token = prefs.getString(KEY_TOKEN, null);

                  if (token != null && !token.isEmpty()) {
                      setBusy(true, "Checking access...");
                      validateSession(token);
                  } else {
                      setBusy(false, "Enter your Exile Tube login.");
                      usernameInput.requestFocus();
                  }
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(80, 50, 80, 50);
                  root.setBackgroundColor(Color.rgb(10, 10, 10));

                  LinearLayout.LayoutParams wideParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  wideParams.setMargins(0, 10, 0, 10);

                  ImageView logo = new ImageView(this);

                  try {
                      Drawable icon = getPackageManager()
                              .getApplicationIcon(getApplicationInfo());

                      logo.setImageDrawable(icon);
                  } catch (Exception ignored) {
                  }

                  LinearLayout.LayoutParams logoParams =
                          new LinearLayout.LayoutParams(180, 180);

                  logoParams.gravity = Gravity.CENTER_HORIZONTAL;
                  logoParams.setMargins(0, 0, 0, 20);

                  root.addView(logo, logoParams);

                  TextView title = new TextView(this);
                  title.setText("EXILE PREMIUM TUBE");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                  );

                  root.addView(title, wideParams);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Customer Access");
                  subtitle.setTextColor(Color.rgb(255, 95, 31));
                  subtitle.setTextSize(19);
                  subtitle.setGravity(Gravity.CENTER);

                  root.addView(subtitle, wideParams);

                  usernameInput = new EditText(this);
                  usernameInput.setHint("Username");
                  usernameInput.setSingleLine(true);
                  usernameInput.setTextColor(Color.WHITE);
                  usernameInput.setHintTextColor(Color.LTGRAY);
                  usernameInput.setTextSize(20);

                  root.addView(usernameInput, wideParams);

                  passwordInput = new EditText(this);
                  passwordInput.setHint("Password");
                  passwordInput.setSingleLine(true);
                  passwordInput.setTextColor(Color.WHITE);
                  passwordInput.setHintTextColor(Color.LTGRAY);
                  passwordInput.setTextSize(20);
                  passwordInput.setInputType(
                          InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_PASSWORD
                  );

                  root.addView(passwordInput, wideParams);

                  loginButton = new Button(this);
                  loginButton.setText("SIGN IN");
                  loginButton.setTextSize(20);
                  loginButton.setAllCaps(true);
                  loginButton.setFocusable(true);
                  loginButton.setFocusableInTouchMode(true);

                  root.addView(loginButton, wideParams);

                  statusText = new TextView(this);
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(17);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 20, 0, 0);

                  root.addView(statusText, wideParams);

                  loginButton.setOnClickListener(v -> performLogin());

                  setContentView(root);
              }

              private String getOrCreateDeviceId() {
                  String existing =
                          prefs.getString(KEY_DEVICE_ID, null);

                  if (existing != null && existing.length() >= 8) {
                      return existing;
                  }

                  String created = UUID.randomUUID().toString();

                  prefs.edit()
                          .putString(KEY_DEVICE_ID, created)
                          .apply();

                  return created;
              }

              private String getDeviceName() {
                  String manufacturer =
                          Build.MANUFACTURER == null
                                  ? ""
                                  : Build.MANUFACTURER;

                  String model =
                          Build.MODEL == null
                                  ? "Android TV"
                                  : Build.MODEL;

                  String name =
                          (manufacturer + " " + model).trim();

                  if (name.length() > 255) {
                      name = name.substring(0, 255);
                  }

                  return name;
              }

              private void performLogin() {
                  String username =
                          usernameInput.getText().toString().trim();

                  String password =
                          passwordInput.getText().toString();

                  if (username.isEmpty() || password.isEmpty()) {
                      statusText.setText(
                              "Enter your username and password."
                      );

                      return;
                  }

                  setBusy(true, "Signing in...");

                  new Thread(() -> {
                      try {
                          JSONObject request = new JSONObject();

                          request.put("username", username);
                          request.put("password", password);
                          request.put("deviceId", deviceId);
                          request.put(
                                  "deviceName",
                                  getDeviceName()
                          );

                          JSONObject response =
                                  postJson(
                                          API_BASE + "/client/login",
                                          request
                                  );

                          String status =
                                  response.optString(
                                          "status",
                                          "denied"
                                  );

                          String message =
                                  response.optString(
                                          "message",
                                          "Access denied."
                                  );

                          if ("allowed".equalsIgnoreCase(status)) {
                              String token =
                                      response.optString(
                                              "token",
                                              ""
                                      );

                              if (token.isEmpty()) {
                                  showError(
                                          "Login succeeded but no session token was returned."
                                  );

                                  return;
                              }

                              prefs.edit()
                                      .putString(KEY_TOKEN, token)
                                      .apply();

                              checkForUpdateThenOpen();
                          } else {
                              showError(message);
                          }
                      } catch (Exception e) {
                          showError(
                                  "Unable to contact Exile Access. Check your internet connection."
                          );
                      }
                  }).start();
              }

              private void validateSession(String token) {
                  new Thread(() -> {
                      try {
                          JSONObject request =
                                  new JSONObject();

                          request.put("token", token);
                          request.put("deviceId", deviceId);

                          JSONObject response =
                                  postJson(
                                          API_BASE + "/client/session",
                                          request
                                  );

                          String status =
                                  response.optString(
                                          "status",
                                          "denied"
                                  );

                          String message =
                                  response.optString(
                                          "message",
                                          "Access denied."
                                  );

                          if ("allowed".equalsIgnoreCase(status)) {
                              checkForUpdateThenOpen();
                          } else {
                              prefs.edit()
                                      .remove(KEY_TOKEN)
                                      .apply();

                              showError(message);
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              setBusy(
                                      false,
                                      "Unable to verify access. Check your internet connection."
                              );

                              usernameInput.requestFocus();
                          });
                      }
                  }).start();
              }

              private void checkForUpdateThenOpen() {
                  runOnUiThread(() ->
                          statusText.setText(
                                  "Checking for updates..."
                          )
                  );

                  new Thread(() -> {
                      try {
                          JSONObject update =
                                  getJson(UPDATE_ENDPOINT);

                          boolean enabled =
                                  update.optBoolean(
                                          "updatesEnabled",
                                          false
                                  );

                          int remoteVersion =
                                  update.optInt(
                                          "versionCode",
                                          0
                                  );

                          String versionName =
                                  update.optString(
                                          "versionName",
                                          ""
                                  );

                          String apkUrl =
                                  update.optString(
                                          "apkDownloadUrl",
                                          ""
                                  );

                          boolean required =
                                  update.optBoolean(
                                          "required",
                                          false
                                  );

                          String message =
                                  update.optString(
                                          "message",
                                          ""
                                  );

                          int installedVersion =
                                  getInstalledVersionCode();

                          if (
                                  enabled &&
                                  remoteVersion > installedVersion &&
                                  !apkUrl.isEmpty()
                          ) {
                              showUpdateDialog(
                                      versionName,
                                      apkUrl,
                                      required,
                                      message
                              );
                          } else {
                              runOnUiThread(
                                      this::openSmartTube
                              );
                          }
                      } catch (Exception ignored) {
                          runOnUiThread(this::openSmartTube);
                      }
                  }).start();
              }

              private int getInstalledVersionCode()
                      throws Exception {

                  PackageInfo info =
                          getPackageManager()
                                  .getPackageInfo(
                                          getPackageName(),
                                          0
                                  );

                  if (Build.VERSION.SDK_INT >= 28) {
                      return (int) info.getLongVersionCode();
                  }

                  return info.versionCode;
              }

              private void showUpdateDialog(
                      String versionName,
                      String apkUrl,
                      boolean required,
                      String message
              ) {
                  runOnUiThread(() -> {
                      String title = "Exile Tube Update";

                      String body = message;

                      if (body == null || body.trim().isEmpty()) {
                          body =
                                  "A new version of Exile Tube is available.";
                      }

                      if (
                              versionName != null &&
                              !versionName.trim().isEmpty()
                      ) {
                          body += "\n\nVersion " + versionName;
                      }

                      AlertDialog.Builder builder =
                              new AlertDialog.Builder(this);

                      builder.setTitle(title);
                      builder.setMessage(body);

                      builder.setPositiveButton(
                              "UPDATE NOW",
                              (dialog, which) ->
                                      beginUpdate(
                                              apkUrl,
                                              versionName
                                      )
                      );

                      if (!required) {
                          builder.setNegativeButton(
                                  "LATER",
                                  (dialog, which) ->
                                          openSmartTube()
                          );
                      }

                      AlertDialog dialog = builder.create();

                      dialog.setCancelable(!required);
                      dialog.setCanceledOnTouchOutside(
                              !required
                      );

                      dialog.show();
                  });
              }

              private void beginUpdate(
                      String apkUrl,
                      String versionName
              ) {
                  pendingUpdateUrl = apkUrl;
                  pendingVersionName = versionName;

                  if (
                          Build.VERSION.SDK_INT >= 26 &&
                          !getPackageManager()
                                  .canRequestPackageInstalls()
                  ) {
                      try {
                          Intent permissionIntent =
                                  new Intent(
                                          Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                          Uri.parse(
                                                  "package:" +
                                                  getPackageName()
                                          )
                                  );

                          startActivityForResult(
                                  permissionIntent,
                                  REQUEST_INSTALL_PERMISSION
                          );

                          return;
                      } catch (Exception ignored) {
                      }
                  }

                  startUpdateDownload(
                          pendingUpdateUrl,
                          pendingVersionName
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (
                          requestCode ==
                                  REQUEST_INSTALL_PERMISSION
                  ) {
                      if (
                              Build.VERSION.SDK_INT < 26 ||
                              getPackageManager()
                                      .canRequestPackageInstalls()
                      ) {
                          startUpdateDownload(
                                  pendingUpdateUrl,
                                  pendingVersionName
                          );
                      } else {
                          statusText.setText(
                                  "Install permission is required to update Exile Tube."
                          );
                      }
                  }
              }

              private void startUpdateDownload(
                      String apkUrl,
                      String versionName
              ) {
                  try {
                      if (
                              apkUrl == null ||
                              apkUrl.trim().isEmpty()
                      ) {
                          openSmartTube();
                          return;
                      }

                      statusText.setText(
                              "Downloading Exile Tube update..."
                      );

                      DownloadManager manager =
                              (DownloadManager)
                                      getSystemService(
                                              DOWNLOAD_SERVICE
                                      );

                      if (manager == null) {
                          throw new Exception(
                                  "Download Manager unavailable."
                          );
                      }

                      Uri downloadUri =
                              Uri.parse(apkUrl);

                      DownloadManager.Request request =
                              new DownloadManager.Request(
                                      downloadUri
                              );

                      request.setTitle(
                              "Exile Tube Update"
                      );

                      request.setDescription(
                              versionName == null
                                      ? "Downloading update"
                                      : "Downloading version " +
                                        versionName
                      );

                      request.setNotificationVisibility(
                              DownloadManager.Request
                                      .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );

                      request.setMimeType(
                              "application/vnd.android.package-archive"
                      );

                      request.setDestinationInExternalFilesDir(
                              this,
                              Environment.DIRECTORY_DOWNLOADS,
                              "ExileTube-update.apk"
                      );

                      registerDownloadReceiver(manager);

                      activeDownloadId =
                              manager.enqueue(request);
                  } catch (Exception e) {
                      statusText.setText(
                              "Unable to download the update."
                      );
                  }
              }

              private void registerDownloadReceiver(
                      DownloadManager manager
              ) {
                  if (downloadReceiver != null) {
                      return;
                  }

                  downloadReceiver =
                          new BroadcastReceiver() {
                              @Override
                              public void onReceive(
                                      Context context,
                                      Intent intent
                              ) {
                                  long id =
                                          intent.getLongExtra(
                                                  DownloadManager.EXTRA_DOWNLOAD_ID,
                                                  -1
                                          );

                                  if (
                                          id != activeDownloadId
                                  ) {
                                      return;
                                  }

                                  Uri apkUri =
                                          manager
                                                  .getUriForDownloadedFile(
                                                          id
                                                  );

                                  if (apkUri == null) {
                                      statusText.setText(
                                              "Update download failed."
                                      );

                                      unregisterDownloadReceiver();
                                      return;
                                  }

                                  try {
                                      Intent install =
                                              new Intent(
                                                      Intent.ACTION_VIEW
                                              );

                                      install.setDataAndType(
                                              apkUri,
                                              "application/vnd.android.package-archive"
                                      );

                                      install.addFlags(
                                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                                      );

                                      install.addFlags(
                                              Intent.FLAG_ACTIVITY_NEW_TASK
                                      );

                                      startActivity(install);
                                  } catch (Exception e) {
                                      statusText.setText(
                                              "Update downloaded but Android could not open the installer."
                                      );
                                  }

                                  unregisterDownloadReceiver();
                              }
                          };

                  IntentFilter filter =
                          new IntentFilter(
                                  DownloadManager
                                          .ACTION_DOWNLOAD_COMPLETE
                          );

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                              downloadReceiver,
                              filter,
                              Context.RECEIVER_NOT_EXPORTED
                      );
                  } else {
                      registerReceiver(
                              downloadReceiver,
                              filter
                      );
                  }
              }

              private void unregisterDownloadReceiver() {
                  if (downloadReceiver == null) {
                      return;
                  }

                  try {
                      unregisterReceiver(
                              downloadReceiver
                      );
                  } catch (Exception ignored) {
                  }

                  downloadReceiver = null;
              }

              @Override
              protected void onDestroy() {
                  unregisterDownloadReceiver();
                  super.onDestroy();
              }

              private JSONObject getJson(String endpoint)
                      throws Exception {

                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  new URL(endpoint)
                                          .openConnection();

                  connection.setRequestMethod("GET");
                  connection.setConnectTimeout(10000);
                  connection.setReadTimeout(10000);

                  connection.setRequestProperty(
                          "Accept",
                          "application/json"
                  );

                  int responseCode =
                          connection.getResponseCode();

                  if (
                          responseCode < 200 ||
                          responseCode >= 300
                  ) {
                      connection.disconnect();

                      throw new Exception(
                              "HTTP " + responseCode
                      );
                  }

                  InputStream input =
                          connection.getInputStream();

                  StringBuilder responseText =
                          new StringBuilder();

                  try (
                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  input,
                                                  StandardCharsets.UTF_8
                                          )
                                  )
                  ) {
                      String line;

                      while (
                              (line = reader.readLine())
                                      != null
                      ) {
                          responseText.append(line);
                      }
                  } finally {
                      connection.disconnect();
                  }

                  return new JSONObject(
                          responseText.toString()
                  );
              }

              private JSONObject postJson(
                      String endpoint,
                      JSONObject body
              ) throws Exception {

                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  new URL(endpoint)
                                          .openConnection();

                  connection.setRequestMethod("POST");
                  connection.setConnectTimeout(10000);
                  connection.setReadTimeout(10000);
                  connection.setDoOutput(true);

                  connection.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=utf-8"
                  );

                  connection.setRequestProperty(
                          "Accept",
                          "application/json"
                  );

                  byte[] payload =
                          body.toString()
                                  .getBytes(
                                          StandardCharsets.UTF_8
                                  );

                  try (
                          OutputStream output =
                                  connection
                                          .getOutputStream()
                  ) {
                      output.write(payload);
                  }

                  int responseCode =
                          connection.getResponseCode();

                  InputStream input;

                  if (
                          responseCode >= 200 &&
                          responseCode < 300
                  ) {
                      input =
                              connection
                                      .getInputStream();
                  } else {
                      input =
                              connection
                                      .getErrorStream();
                  }

                  if (input == null) {
                      throw new Exception(
                              "Empty server response: " +
                              responseCode
                      );
                  }

                  StringBuilder responseText =
                          new StringBuilder();

                  try (
                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  input,
                                                  StandardCharsets.UTF_8
                                          )
                                  )
                  ) {
                      String line;

                      while (
                              (line = reader.readLine())
                                      != null
                      ) {
                          responseText.append(line);
                      }
                  } finally {
                      connection.disconnect();
                  }

                  return new JSONObject(
                          responseText.toString()
                  );
              }

              private void showError(String message) {
                  runOnUiThread(() -> {
                      setBusy(false, message);
                      passwordInput.setText("");
                      usernameInput.requestFocus();
                  });
              }

              private void setBusy(
                      boolean busy,
                      String message
              ) {
                  usernameInput.setEnabled(!busy);
                  passwordInput.setEnabled(!busy);
                  loginButton.setEnabled(!busy);
                  statusText.setText(message);
              }

              private void openSmartTube() {
                  Intent intent =
                          new Intent(
                                  this,
                                  SplashActivity.class
                          );

                  startActivity(intent);
                  finish();
              }
          }
          JAVA

          python3 - <<'PY'
