                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
          '''

          if launcher_filter not in text:
              raise SystemExit(
                  'Could not locate original SmartTube launcher filter'
              )

          text = text.replace(
              launcher_filter,
              '',
              1
          )

          manifest.write_text(text)
          PY

          echo "Exile Access login gate and updater added."

      - name: Apply Exile Premium Tube artwork
        run: |
          set -e

          ICON="exile/IMG_9170.png"
          SPLASH="exile/IMG_9171.jpeg"
          BANNER="exile/BDEA3ABA-ABD5-46CC-BE86-6DFDB9550A24.png"
          INTERNAL_LOGO="$ICON"

          find smarttube/smarttubetv/src -type f \
            \( -name 'app_icon.png' -o \
               -name 'app_logo.png' -o \
               -name 'app_banner.png' \) \
            -print

          while IFS= read -r target; do
            case "$(basename "$target")" in
              app_icon.png)
                cp "$ICON" "$target"
                ;;
              app_logo.png)
                cp "$ICON" "$target"
                ;;
              app_banner.png)
                cp "$BANNER" "$target"
                ;;
            esac
          done < <(
            find smarttube/smarttubetv/src -type f \
              \( -name 'app_icon.png' -o \
                 -name 'app_logo.png' -o \
                 -name 'app_banner.png' \)
          )

          mkdir -p \
            smarttube/smarttubetv/src/stfdroid/res/drawable-nodpi

          cp "$SPLASH" \
            smarttube/smarttubetv/src/stfdroid/res/drawable-nodpi/exile_splash.jpg

          while IFS= read -r target; do
            cp "$INTERNAL_LOGO" "$target"
          done < <(
            find smarttube/smarttubetv/src -type f \
              \( -name 'app_logo_semi_red.png' -o \
                 -name 'app_logo_semi_grey.png' -o \
                 -name 'app_icon_alt.png' \)
          )

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.0.6113669"

      - name: Restore permanent Exile signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXILE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EXILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EXILE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > smarttube/exile-production.keystore

          cat > smarttube/keystore.properties <<EOF
          storeFile=../exile-production.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify permanent signing key
        env:
          STORE_PASSWORD: ${{ secrets.EXILE_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore smarttube/exile-production.keystore \
            -storepass "$STORE_PASSWORD" >/dev/null

          echo "Permanent Exile signing key verified."

      - name: Build permanently signed Exile Tube APK
        working-directory: smarttube
        env:
          JAVA_TOOL_OPTIONS: -XX:+PerfDisableSharedMem
        run: |
          chmod +x gradlew

          ./gradlew --no-daemon \
            :smarttubetv:assembleStfdroidDebug

      - name: Verify APK signature
        run: |
          UNIVERSAL_APK="$(find \
            smarttube/smarttubetv/build/outputs/apk/stfdroid/debug \
            -type f -name '*universal*.apk' | head -n 1)"

          if [ -z "$UNIVERSAL_APK" ]; then
            echo "Universal APK not found."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/30.0.3/apksigner" \
            verify --verbose "$UNIVERSAL_APK"

          echo "Exile Tube APK signature verified."

      - name: Upload permanently signed Exile Tube APK
        uses: actions/upload-artifact@v4
        with:
          name: ExileTube-build10-updater
          path: >
            smarttube/smarttubetv/build/outputs/apk/stfdroid/debug/*.apk
          if-no-files-found: error
